name: Build Portable

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: PERSONAL-WORKSPACE-V4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: PERSONAL-WORKSPACE-V4/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test:all
      - name: Build portable
        run: pnpm desktop:portable
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: SCT-Workspace-Portable
          path: PERSONAL-WORKSPACE-V4/release/*.exe
          if-no-files-found: error
          retention-days: 14
